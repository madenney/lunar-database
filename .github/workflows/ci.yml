name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      # mongo:7, not :8 — MongoDB 8 refuses to start on Linux kernels 6.19–7.0.13
      # (SERVER-121912), which some CI runners are on. The tests are version-agnostic
      # (CRUD, indexes, TTL, aggregation), so 7 is a safe, reliable choice for CI.
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Typecheck & build
        run: npm run build

      - name: Test
        run: npx jest --ci --runInBand
        env:
          MONGODB_URI: mongodb://localhost:27017/lm-database-ci

      - name: Dependency audit (production deps)
        # Gate on high+ advisories in what actually SHIPS. Dev-only tooling (jest,
        # ts-jest and their transitive deps) is excluded — a DoS advisory inside a
        # test-time package doesn't affect the running API, and gating on it would
        # make CI perpetually red on unrelated CVE churn.
        run: npm audit --omit=dev --audit-level=high

      - name: Secret scan (gitleaks)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks dir . -c .gitleaks.toml --no-banner --redact --exit-code 1
